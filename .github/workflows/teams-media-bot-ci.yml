name: Teams Media Bot CI

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/teams-media-bot-ci.yml'
      - 'Samples/V1.0Samples/LocalMediaSamples/PolicyRecordingBot/**'
      - '!**/*.md'
      - '!**/docs/**'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/teams-media-bot-ci.yml'
      - 'Samples/V1.0Samples/LocalMediaSamples/PolicyRecordingBot/**'
      - '!**/*.md'
      - '!**/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '6.0.x'
  SOLUTION_PATH: 'Samples/V1.0Samples/LocalMediaSamples/PolicyRecordingBot'
  BUILD_CONFIGURATION: 'Release'

jobs:
  # Job 1: Build and Test C# Bot
  build-and-test-bot:
    runs-on: windows-latest
    name: Build Teams Media Bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better build caching

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-path: |
            ~/.nuget/packages

      - name: Restore dependencies
        run: |
          cd ${{ env.SOLUTION_PATH }}
          dotnet restore --verbosity normal
        shell: pwsh

      - name: Build solution
        run: |
          cd ${{ env.SOLUTION_PATH }}
          dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal
        shell: pwsh

      - name: Run unit tests
        if: success()
        run: |
          cd ${{ env.SOLUTION_PATH }}
          if (Test-Path "PolicyRecordingBot.Tests/*.csproj") {
            dotnet test PolicyRecordingBot.Tests/*.csproj `
              --configuration ${{ env.BUILD_CONFIGURATION }} `
              --no-build `
              --verbosity normal `
              --logger "trx;LogFileName=test-results.trx" `
              --collect:"XPlat Code Coverage"
          } else {
            Write-Host "No test project found, skipping tests"
          }
        shell: pwsh
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-bot
          path: |
            ${{ env.SOLUTION_PATH }}/**/TestResults/**/*.trx
            ${{ env.SOLUTION_PATH }}/**/TestResults/**/*.xml
          retention-days: 7

      - name: Publish build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teams-media-bot-build
          path: |
            ${{ env.SOLUTION_PATH }}/**/bin/${{ env.BUILD_CONFIGURATION }}/**
          retention-days: 7

  # Job 2: Code Quality Analysis
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run code style check (dotnet format)
        run: |
          cd ${{ env.SOLUTION_PATH }}
          dotnet format --verify-no-changes --verbosity diagnostic || echo "Code formatting issues detected"
        continue-on-error: true

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SOLUTION_PATH }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Job 3: Test Python Signaling Server
  test-signaling-server:
    runs-on: ubuntu-latest
    name: Test Signaling Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov websockets aiohttp

      - name: Run signaling server tests
        if: success()
        run: |
          if [ -d "${{ env.SOLUTION_PATH }}/signaling/tests" ]; then
            cd ${{ env.SOLUTION_PATH }}/signaling
            pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
          else
            echo "No signaling server tests found yet"
          fi
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signaling-server-coverage
          path: |
            ${{ env.SOLUTION_PATH }}/signaling/htmlcov/**
            ${{ env.SOLUTION_PATH }}/signaling/coverage.xml
          retention-days: 7

  # Job 4: Integration Tests (Future)
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [build-and-test-bot, test-signaling-server]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Placeholder for integration tests
        run: |
          echo "Integration tests will be implemented in future phases"
          echo "These will test:"
          echo "  - Teams bot ↔ Signaling server"
          echo "  - WebRTC peer connection establishment"
          echo "  - End-to-end audio flow"

  # Job 5: Build Status Summary
  ci-summary:
    runs-on: ubuntu-latest
    name: CI Summary
    needs: [build-and-test-bot, code-quality, test-signaling-server]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "CI Build Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Build Jobs:"
          echo "  Bot Build & Test: ${{ needs.build-and-test-bot.result }}"
          echo "  Code Quality: ${{ needs.code-quality.result }}"
          echo "  Signaling Server: ${{ needs.test-signaling-server.result }}"
          echo ""

          if [ "${{ needs.build-and-test-bot.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.test-signaling-server.result }}" == "success" ]; then
            echo "✅ All CI jobs passed!"
            exit 0
          else
            echo "❌ Some CI jobs failed - check logs above"
            exit 1
          fi
